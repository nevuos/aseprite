name: Compilar Aseprite

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Descarregar e Extrair Skia Completa
        shell: cmd
        run: |
          mkdir skia
          curl.exe -L -o skia.zip "https://github.com/aseprite/skia/releases/download/m124-08a5439a6b/Skia-Windows-Release-x64.zip"
          tar.exe -xf skia.zip -C skia

      - name: Compilar Aseprite
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR=%CD%\skia ^
            -DSKIA_LIBRARY_DIR=%CD%\skia\out\Release-x64 ^
            -DSKIA_LIBRARY=%CD%\skia\out\Release-x64\skia.lib
          ninja -C build aseprite

      - name: Empacotar Executável e Dados
        shell: cmd
        run: |
          mkdir aseprite-dist
          copy build\bin\aseprite.exe aseprite-dist\
          xcopy /E /I /Y build\bin\data aseprite-dist\data

      - name: Disponibilizar para Download
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-Completo
          path: aseprite-dist
