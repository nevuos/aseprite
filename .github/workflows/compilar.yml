name: Compilar Aseprite

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Descarregar Skia pré-compilada
        shell: bash
        run: |
          curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m102/Skia-Windows-Release-x64.zip
          7z x skia.zip -oskia

      - name: Compilar Aseprite
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DLAF_BACKEND=skia ^
            -DSKIA_DIR=%CD%\skia ^
            -DSKIA_LIBRARY_DIR=%CD%\skia\out\Release-x64 ^
            -DSKIA_LIBRARY=%CD%\skia\out\Release-x64\skia.lib
          ninja -C build aseprite

      - name: Empacotar Executável e Dados
        shell: bash
        run: |
          mkdir aseprite-dist
          cp build/bin/aseprite.exe aseprite-dist/
          cp -r bin/data aseprite-dist/data

      - name: Disponibilizar para Download
        uses: actions/upload-artifact@v4
        with:
          name: Aseprite-Windows-Completo
          path: aseprite-dist
